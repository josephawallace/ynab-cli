[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  # Independent transitive dependency lines; exact versions force re-review
  # when Cargo.lock changes.
  { name = "getrandom", version = "=0.2.17" },
  { name = "linux-raw-sys", version = "=0.4.15" },
  { name = "rustix", version = "=0.38.44" },
  { name = "syn", version = "=2.0.119" },
  { name = "unicode-width", version = "=0.1.14" },
  { name = "windows-sys", version = "=0.52.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
